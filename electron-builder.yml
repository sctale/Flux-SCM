appId: com.flux-scm.app
productName: Flux-SCM
publish: null
directories:
  output: release
  buildResources: public
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
files:
  - electron/**/*
  - dist/**/*
  - server/**/*.js
  - node_modules/**/*
  - package.json
